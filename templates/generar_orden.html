{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-3 flex-wrap">
  <h5 class="mb-0">Generar orden de compra</h5>
  <span class="text-muted small">Fecha: {{ hoy }}</span>
  <form method="get" class="d-flex align-items-center gap-1">
    <span class="small text-muted">Ver sucursal:</span>
    <select name="suc" class="form-select form-select-sm" style="width:auto" onchange="this.form.submit()">
      <option value="">Todas</option>
      {% for su in sucursales %}<option value="{{ su }}" {% if filtro_suc==su %}selected{% endif %}>{{ su }}</option>{% endfor %}
    </select>
    {% if filtro_suc %}<a href="{{ url_for('generar_orden') }}" class="btn btn-sm btn-outline-secondary">✕</a>{% endif %}
  </form>
  <div class="ms-auto d-flex gap-2 flex-wrap align-items-center">
    {% if sucs_orden %}
    <span class="small text-muted">Exportar pedido de:</span>
    <select id="export-suc" class="form-select form-select-sm" style="width:auto">
      {% for s in sucs_orden %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
    </select>
    <button class="btn btn-sm text-white" style="background:#166534"
      onclick="exportPedido('CD')">↓ Quantio (CD)</button>
    <button class="btn btn-sm text-white" style="background:#92400e"
      onclick="exportPedido('SUD')">↓ SUD (.dds)</button>
    <button class="btn btn-sm text-white" style="background:#5b21b6"
      onclick="exportPedido('SUIZO')">↓ SUIZO (.arg)</button>
    {% endif %}
    <a class="btn btn-sm text-white" style="background:#0f766e" href="/reporte/rotacion.xlsx">↓ Rotación (.xlsx)</a>
  </div>
</div>
<div id="orden-grid">
  {% include '_orden_grid.html' %}
</div>
{% endblock %}
{% block scripts %}
<script>
function toggleDet(sku, btn) {
  const row = document.querySelector('.detalle-' + CSS.escape(sku));
  if (!row) return;
  const show = row.style.display === 'none';
  row.style.display = show ? '' : 'none';
  btn.textContent = show ? '▾' : '▸';
}

async function descargar(url, payload, fallbackName) {
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    let msg = 'No se pudo generar el archivo.';
    try { const e = await res.json(); if (e.error) msg = e.error; } catch (_) {}
    alert(msg);
    return;
  }
  const cd = res.headers.get('Content-Disposition') || '';
  const m = cd.match(/filename="?([^"]+)"?/);
  const name = m ? m[1] : fallbackName;
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}

function exportPedido(code) {
  const sel = document.getElementById('export-suc');
  if (!sel || !sel.value) { alert('Elegí una sucursal'); return; }
  const suc = sel.value;
  const url = code === 'CD' ? '/exportar-quantio' : '/exportar/' + code;
  descargar(url, {sucursal: suc}, 'pedido_' + code.toLowerCase());
}

async function enviarItem(sku, suc, code, btn) {
  const pill = btn.closest('div');
  const inp  = pill.querySelector('.env-input');
  const cant = parseInt(inp.value, 10) || 0;
  if (cant <= 0) { alert('Poné una cantidad mayor a 0'); return; }
  btn.disabled = true;
  const res = await fetch('/api/orden/enviar', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({sku, sucursal: suc, drogueria: code, cantidad: cant})
  });
  const d = await res.json().catch(() => ({}));
  if (res.ok && d.ok) location.reload(); else { btn.disabled = false; alert(d.error || 'No se pudo enviar.'); }
}

async function rotacionItem(sku, suc, btn) {
  const pill = btn.closest('div');
  const inp  = pill.querySelector('.env-input');
  const cant = parseInt(inp.value, 10) || 0;
  if (cant <= 0) { alert('Poné una cantidad mayor a 0'); return; }
  if (!confirm('¿Cubrir ' + cant + ' u. de ' + suc + ' por ROTACIÓN (stock interno)?')) return;
  btn.disabled = true;
  const res = await fetch('/api/orden/rotacion', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({sku, sucursal: suc, cantidad: cant})
  });
  const d = await res.json().catch(() => ({}));
  if (res.ok && d.ok) location.reload(); else { btn.disabled = false; alert(d.error || 'No se pudo.'); }
}

async function omitirItem(sku, suc, code) {
  const res = await fetch('/api/orden/omitir', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({sku, sucursal: suc, drogueria: code})
  });
  const d = await res.json().catch(() => ({}));
  if (res.ok && d.ok) location.reload(); else alert(d.error || 'No se pudo.');
}

async function omitirProducto(sku, code) {
  if (!confirm('¿Quitar este producto de esta droguería (todas las sucursales)?')) return;
  const res = await fetch('/api/orden/omitir-producto', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({sku, drogueria: code})
  });
  const d = await res.json().catch(() => ({}));
  if (res.ok && d.ok) location.reload(); else alert(d.error || 'No se pudo.');
}

async function marcarComprado(drog) {
  const hoy = new Date().toLocaleDateString('es-AR', {day:'2-digit',month:'2-digit',year:'numeric'});
  const res = await fetch('/api/orden/comprado', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({drogueria: drog, fecha: hoy})
  });
  const d = await res.json();
  if (d.ok) {
    alert(`✓ ${drog}: ${d.n} producto(s) marcados como comprados y quitados de la orden.`);
    location.reload();
  }
}

async function marcarInexistente() {
  const skus = [];
  document.querySelectorAll('.qty-input[data-drog="SIN_PRECIO"]').forEach(inp => skus.push(inp.dataset.sku));
  if (!skus.length) { alert('No hay productos sin precio'); return; }
  if (!confirm('¿Marcar estos productos como INEXISTENTES?\nAparecerán como Cancelado / "Producto inexistente" en los pedidos.')) return;
  const res = await fetch('/api/orden/inexistente', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({skus})
  });
  const d = await res.json().catch(() => ({}));
  if (res.ok && d.ok) location.reload(); else alert(d.error || 'No se pudo.');
}
</script>
{% endblock %}
